 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Harshayt Embedder</title>
</head>
<body>
<script>
const url = prompt("Enter the website URL:");

if (url && url.trim()) {
  let target;

  try {
    target = new URL(url.trim());

    if (!["https:", "http:"].includes(target.protocol)) {
      throw new Error();
    }

    document.body.innerHTML = `
      <h2>Harshayt Embedder</h2>
      <button id="open">Open in about:blank</button>
    `;

    document.getElementById("open").onclick = () => {
      const newTab = window.open("about:blank", "_blank");

      if (!newTab) {
        alert("Allow pop-ups for this website.");
        return;
      }

      const iframe = newTab.document.createElement("iframe");
      iframe.src = target.href;
      iframe.style.cssText =
        "width:100%;height:100%;border:0;position:fixed;inset:0";

      newTab.document.body.style.margin = "0";
      newTab.document.body.appendChild(iframe);
    };
  } catch {
    alert("Enter a valid http:// or https:// URL.");
  }
}
</script>
</body>
</html>
