 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harshayt Embedder</title>
</head>
<body>
<script>
(() => {
  const url = prompt("Enter the website URL:");

  if (!url || !url.trim()) {
    document.body.textContent = "No URL entered.";
    return;
  }

  let target;

  try {
    target = new URL(url.trim());
    if (!["http:", "https:"].includes(target.protocol)) {
      throw new Error("Invalid protocol");
    }
  } catch {
    alert("Please enter a valid URL starting with https:// or http://");
    return;
  }

  document.body.innerHTML = `
    <h3>Ready to open your website</h3>
    <button id="open">Open in about:blank</button>
  `;

  document.getElementById("open").addEventListener("click", () => {
    const win = window.open("about:blank", "_blank");

    if (!win) {
      alert("Pop-up blocked. Allow pop-ups for this website in Chrome.");
      return;
    }

    const iframe = win.document.createElement("iframe");
    iframe.src = target.href;
    iframe.style.cssText =
      "position:fixed;inset:0;width:100%;height:100%;border:0";

    win.document.body.style.margin = "0";
    win.document.body.appendChild(iframe);
  });
})();
</script>
</body>
</html>
